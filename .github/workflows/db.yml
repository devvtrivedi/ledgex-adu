name: db

on:
  push:
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest
    # P27: no job in this file had a bound before this pass -- GitHub's
    # 360-minute default applied, so a hang here ran to six hours instead
    # of failing promptly. The initial suspect was scripts/test_snapshot_
    # race_invariant.py's own lock wait -- checked and disproven (insert_
    # snapshot() commits internally before returning, so there is no
    # uncommitted row for a second connection to block on). The real
    # cause, read off run 32171649751's own per-step timestamps: the
    # "Install postgresql-client-16" step (apt-get) stalled for 20+
    # minutes -- see that step's own comment below and
    # prompts/P27-ci-timeouts-and-lock-wait.md. Historical wall-clock for
    # this job is ~1-2 minutes; 20 is generous headroom, not a tight fit,
    # and still fails an order of magnitude faster than the default.
    timeout-minutes: 20

    # Pinned to 16-3.4, not `latest` or `16`: §3 specifies "PostgreSQL 16 +
    # PostGIS 3.4" as the schema's target, and a schema-only dump taken
    # against a different major version produces a false diff against the
    # committed db/schema.sql (this project already hit exactly that
    # problem once, with a local PG 17 server).
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # NOT the service's own default database. The postgis/postgis image's
      # entrypoint runs its full init stack (postgis, postgis_topology,
      # postgis_tiger_geocoder, fuzzystrmatch extensions and the
      # tiger/tiger_data/topology schemas) against whatever database
      # POSTGRES_DB names -- not specifically the literal name "postgres",
      # against WHATEVER the default database is. Applying migrations there
      # directly means db/schema.sql picks up all of that TIGER-geocoder
      # baggage as noise. ledgex_ci is created fresh, after the container is
      # up, by the step below -- never auto-inited -- exactly the "avoid the
      # postgis image's TIGER-polluted default db" lesson from this
      # project's own earlier schema.sql fix, hit again here because a CI
      # service container has no hook to create the database before its own
      # init scripts run against whatever POSTGRES_DB says.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ledgex_ci
      # Referenced by full path, not left to resolve on PATH: Ubuntu's
      # postgresql-client-16 package does not necessarily become the
      # unqualified `psql`/`pg_dump` if another client version is already
      # present on the runner image, and a version mismatch against the
      # PostgreSQL 16 service is the same false-diff trap as above.
      PSQL: /usr/lib/postgresql/16/bin/psql
      PG_DUMP: /usr/lib/postgresql/16/bin/pg_dump

    steps:
      - uses: actions/checkout@v4

      # P27: step-level bound, tighter than this job's own 20-minute
      # timeout-minutes above. Real evidence, not a guess: run 32171649751
      # hung at exactly this step for 20+ minutes (schema and
      # phaseb-acceptance both, same push) while p5-acceptance's identical
      # step on the identical commit finished in 6 seconds -- a transient
      # apt/mirror stall on the runner, confirmed not to be
      # scripts/test_snapshot_race_invariant.py or make conformance (see
      # prompts/P27-ci-timeouts-and-lock-wait.md): neither step had even
      # started yet when the job was cancelled. This bound makes a repeat
      # fail here, by name, in minutes -- not consume the whole job's
      # timeout budget before anyone can tell which step actually stalled.
      - name: Install postgresql-client-16
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          "$PSQL" --version
          "$PG_DUMP" --version

      # P6 follow-up: scripts/migrate_verify.py (Python + psycopg2) needs to
      # run right after `make schema` below, to check the database that
      # target just built against its own ledger. This job had no Python
      # step before this pass -- `make schema`/`make schema-dump` were pure
      # psql/pg_dump; P59 (C9) added a small Python locality preflight
      # (infra.env.refuse_remote()) to both targets, so this step now also
      # covers that, not migrate_verify.py alone.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt -r requirements-test.txt

      - name: Create clean database (not the service's TIGER-inited default)
        run: |
          "$PSQL" "postgresql://postgres:postgres@localhost:5432/postgres" \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE ledgex_ci;"

      # Spec §1.2 make schema: "Clean apply; constraints, functions and
      # triggers compile." Applies every forward-only migration, in order,
      # to the empty service database -- and, since the P6 follow-up pass,
      # records each one into schema_migrations as it goes (see the target's
      # own comment in the Makefile for why and how).
      - name: make schema
        run: make schema DATABASE_URL="$DATABASE_URL" PSQL="$PSQL"

      # P6 follow-up: independent check that the database `make schema` just
      # built actually matches what its own ledger claims -- the one thing
      # `make schema`'s own success can't prove by itself (a ledger row and
      # its DDL could still disagree if something between the two steps
      # touched the database directly). Needs CREATE DATABASE privilege to
      # build its own disposable reference -- the CI postgres service user
      # already has it (same superuser the "Create clean database" step
      # above already uses).
      - name: make migrate-verify
        run: make migrate-verify DATABASE_URL="$DATABASE_URL" PG_DUMP="$PG_DUMP"

      # The self-asserting invariant suite (I2-I5, I13, I18, the
      # parcel_exception biconditional, S1's source-access-method check, and
      # Tier 2's provenance/lifecycle constraint tests) plus a
      # separately-reported known_gaps table (I5c) that does not count
      # toward the enforced-coverage floor. Every test aborts the script
      # with a nonzero exit on any wrong outcome under ON_ERROR_STOP --
      # there is no soft-pass path.
      #
      # P18, README finding #25: db-test reads DB_TEST_DATABASE_URL, not
      # DATABASE_URL (its own default, postgresql://localhost/ledgex_test,
      # would not exist here either) -- pass this job's own already-fresh,
      # already-disposable ledgex_ci explicitly, same database every other
      # step in this job already uses.
      - name: make db-test
        run: make db-test DB_TEST_DATABASE_URL="$DATABASE_URL" PSQL="$PSQL"

      # P19, README finding #10: the snapshot-dedup race (two concurrent
      # fetches of identical new content both pass snapshot_exists()'s
      # SELECT, then race insert_snapshot()'s INSERT) can't be an
      # invariants.sql test -- psql can't open two connections. No new job
      # for it either: this job already has a live, disposable ledgex_ci
      # (the same one make db-test just used) and psycopg2 (already a
      # scripts/requirements.txt dependency every sibling
      # scripts/test_*_invariant.py needs) -- nothing about this test needs
      # its own job. Runs after make db-test, before schema-dump: it only
      # adds snapshot/licence/jurisdiction/source rows, which schema-dump's
      # schema-only diff never sees either way.
      - name: scripts/test_snapshot_race_invariant.py
        run: python3 scripts/test_snapshot_race_invariant.py

      # P59, C1: the geometry-interior-point regression fixture (the C1
      # acceptance criterion (d) fixture). Same job, same disposable
      # ledgex_ci database, same reason as the snapshot-race step directly
      # above -- needs a real Python process, not psql. Touches only
      # jurisdiction/parcel/parcel_exception (test_p59_c1 namespace), never
      # licence -- no seeding-order dependency on the day4 step below.
      - name: scripts/test_centroid_interior_invariant.py
        run: python3 scripts/test_centroid_interior_invariant.py

      # P36, README finding #38 (built, not left as a candidate -- finding
      # #36's own gap, cross-seeder drift between db/seeds/day4_sources.sql
      # and scripts/check_golden.py's own rule seed, was CI-unreachable
      # because this job never ran db/seeds/ at all). Runs after db-test
      # and the snapshot-race check above (both remain genuinely
      # migrations-only -- unaffected, still prove what db/tests/
      # invariants.sql's own floor block, corrected by this same package,
      # now says it proves), before make golden. day4_sources.sql is
      # idempotent (ON CONFLICT DO NOTHING throughout, plus the same DO
      # UPDATE on `rule` finding #36 already established) -- applying it
      # here changes what every step BELOW this one sees (real source/
      # licence/jurisdiction/field_definition/rule rows exist from this
      # point on, not just check_golden.py's/check_conformance.py's own
      # narrower synthetic seeds), confirmed harmless to each of them
      # before wiring this in, not assumed: golden, both script-level
      # compose tests, make test and make conformance all rehearsed
      # locally in this exact order, seeded, all unchanged (make golden
      # still PASSED with the identical fixture output; make conformance
      # already used ON CONFLICT DO UPDATE for its own source rows,
      # finding #32's fix, specifically so seeding order can never matter
      # to it). Proves the actual point, not just harmlessness: a
      # deliberately drifted rule.citation, inserted the same way
      # check_golden.py's own seed would, now raises 0013's "I18 violated"
      # for real against this database -- see
      # prompts/P36-election-check-and-seed-drift.md section 2 for the
      # full transcript. make schema-dump remains unaffected either way
      # (schema-only diff, never sees row data).
      - name: db/seeds/day4_sources.sql
        run: |
          "$PSQL" "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seeds/day4_sources.sql

      # P59, C2: load_permits must never fabricate permits.active=false
      # from an unattributable APN. Safe here (unlike ledgex_schema_check
      # locally): this job's ledgex_ci database never receives real bulk
      # permits data, only day4's metadata seed -- see the script's own
      # docstring for why that distinction matters.
      - name: scripts/test_load_permits_attribution.py
        run: python3 scripts/test_load_permits_attribution.py

      # P59, C4: flag_invalid_geometry.py was wired into no Makefile target
      # and no CI workflow -- run the parcel-geometry detector here (the
      # zoning-source half needs its own scratch-file snapshot, not present
      # on a fresh runner; --skip-zoning-source is exactly for this case).
      # Runs AFTER day4_sources.sql, not before: start_job_run() writes a
      # job_run row citing source_id='ca_san_jose.parcels', a real FK that
      # does not exist until this seed has run (confirmed the hard way --
      # ForeignKeyViolation against a migrations-only database, before this
      # step was moved here).
      - name: scripts/flag_invalid_geometry.py --skip-zoning-source
        run: python3 scripts/flag_invalid_geometry.py --skip-zoning-source

      # P59, C4: the regression fixture for the detector + closure path
      # above. Same after-seed placement, same reason.
      - name: scripts/test_flag_invalid_geometry.py
        run: python3 scripts/test_flag_invalid_geometry.py

      # P20: make golden's refused-path fixture (scripts/check_golden.py,
      # tests/golden/ca_san_jose/refused.json) -- same reasoning as the
      # snapshot-race test above, no new job: this is a real database
      # check, this job already has one live and disposable. Runs after
      # the snapshot-race test, before schema-dump, for the same reason --
      # it only adds parcel/fact/property_file rows, invisible to
      # schema-dump's schema-only diff. Exit code here means ONLY that the
      # refused-path check itself passed -- see check_golden.py's own
      # module docstring for why that is not the same claim as "golden
      # covers all four fixture classes."
      #
      # P33, finding #37: GOLDEN_ALLOW_RULE_SEED=1 -- check_golden.py's
      # own seed_reference_rows() now refuses, by default, to insert the
      # one real rule row (0013's rule_no_delete makes it permanent,
      # irreversible) unless explicitly confirmed. ledgex_ci is fresh and
      # disposable, torn down with this runner regardless of what 0013
      # blocks, so confirming here is correct -- unlike a bare local
      # `make golden`, which must NOT be confirmed by default. Kept even
      # though GOLDEN_DATABASE_URL (below) now also guards which database
      # this target can reach at all -- the two guards protect different
      # axes (which database vs. whether an irreversible write on THAT
      # database is expected), per P56 containment's own §2.4 argument for
      # keeping this gate rather than treating GOLDEN_DATABASE_URL as a
      # replacement for it.
      #
      # P56 containment (prompts/P56-fixture-contamination-boundary.md
      # close-out): make golden now reads GOLDEN_DATABASE_URL, never
      # DATABASE_URL, same shape db-test already uses for
      # DB_TEST_DATABASE_URL above -- passing this job's own already-fresh,
      # already-seeded ledgex_ci explicitly, so CI's own behaviour is
      # unchanged: same database, same seeding order, same result.
      - name: make golden
        run: make golden GOLDEN_DATABASE_URL="$DATABASE_URL" PYTHON=python3 GOLDEN_ALLOW_RULE_SEED=1

      # P25: property_file.geometry_tier_used regression guard -- same
      # reasoning as the snapshot-race test and golden above, no new job.
      # Not covered by make golden itself: every real jurisdiction defaults
      # geometry_tier_enabled=false, so a golden fixture alone can never
      # distinguish "correctly read false" from the old hardcoded-false bug
      # (the identical coincidence-masking shape README finding #22 already
      # named once) -- this test stubs core/calc's own separately-tested
      # geometry_tier_enabled=True behavior to prove the write path for
      # real, see the test's own module docstring.
      - name: scripts/test_compose_geometry_tier_used.py
        run: python3 scripts/test_compose_geometry_tier_used.py

      # P34, README finding #35: the election parameter's three distinct
      # L5 outcomes (ELECTION_REQUIRED, ELECTION_NOT_SUPPORTED,
      # RULE_UNAVAILABLE) -- same reasoning as the two tests above, no new
      # job. Not covered by make golden's own election_required fixture
      # alone: that fixture only proves election=None; this proves
      # election="state" and election="city" reach genuinely different
      # code paths too (a synthetic jurisdiction with no seeded rule at
      # all, so RULE_UNAVAILABLE fires against a real query -- see the
      # test's own module docstring for why that third case is the one
      # that actually matters).
      - name: scripts/test_compose_election.py
        run: python3 scripts/test_compose_election.py

      # P37, README finding #40 (re-graded): PARCEL_REFERENCE_UNKNOWN and
      # PARCEL_NO_FACTS -- same reasoning as the two tests above, no new
      # job. Proves compose() now returns a typed Result (no property_file
      # row) for a caller-supplied parcel_id that does not resolve, and a
      # normal refused row (zero property_file_fact links) for a resolved
      # parcel with zero current facts -- both used to raise SystemExit,
      # crashing the process, for any caller, not merely once api/ exists.
      - name: scripts/test_compose_parcel_refusals.py
        run: python3 scripts/test_compose_parcel_refusals.py

      # P43: seeds scripts/seed_internal_test_licences.py's own fixture, then
      # runs `make viewer-test` (P42) -- same reasoning as day4_sources.sql
      # above, no new job: this job already has a live, disposable ledgex_ci,
      # and this seed only adds rows (jurisdiction/licence/licence_channel/
      # source/snapshot/field_definition/parcel/fact under the internal_test.
      # namespace, plus one fact citing the REAL, unchanged cc_by_4_0
      # licence), invisible to schema-dump's schema-only diff either way.
      # Positioned after the three script-level compose suites above (all
      # already seed-dependent, same reasoning) and before make test below.
      #
      # PERMANENT WRITES, HARMLESS HERE, NOT ANYWHERE ELSE. licence and
      # licence_channel rows are immutable (0027, 0033) and (licence_id,
      # channel) is licence_channel's own primary key, so there is no
      # corrected-second-row escape if a rationale or a row is ever wrong --
      # a mistake here is permanent, not merely inconvenient to fix. That is
      # harmless in THIS job specifically because ledgex_ci is built from
      # empty at the top of this exact job and is torn down with the runner
      # when it ends -- every run gets a brand-new database, so a permanent
      # row in it is only ever permanent for the length of one job. It would
      # NOT be harmless run this way against ledgex_schema_check, or any
      # database anyone keeps between runs -- see scripts/seed_internal_test_
      # licences.py's own opt-in gate (SEED_INTERNAL_TEST_LICENCES) and
      # docstring for why that script refuses by default everywhere else.
      # Same shape GOLDEN_ALLOW_RULE_SEED=1 already uses for make golden
      # above, for the identical reason.
      - name: scripts/seed_internal_test_licences.py
        run: SEED_INTERNAL_TEST_LICENCES=1 python3 scripts/seed_internal_test_licences.py

      # P43: proves the I6 rights gate holds on api/'s one fact-rendering
      # route (GET /v1/parcels/{id}/facts), on the fixture the step above
      # just seeded -- see the Makefile's own viewer-test: target comment for
      # exactly what this does and does not cover. Requires requirements.txt
      # (fastapi, pydantic), not only scripts/requirements.txt -- already
      # installed by this job's own "Install Python dependencies" step above
      # (requirements-test.txt itself pulls in requirements.txt).
      - name: make viewer-test
        run: make viewer-test DATABASE_URL="$DATABASE_URL" PYTHON=python3

      # P21: core/model's real pytest suite (tests/core/) -- same reasoning
      # as golden and the snapshot-race test above, no new job. TEST_DATABASE_URL,
      # not DATABASE_URL (own Makefile variable, same reason db-test reads
      # DB_TEST_DATABASE_URL, P18/finding #25) -- passed this job's own
      # already-fresh, already-disposable ledgex_ci explicitly. Exit code
      # here means ONLY that core/model's own real suite passed -- see the
      # Makefile's own test: target comment for why that is not the same
      # claim as "make test covers everything §1.2 lists."
      - name: make test
        run: make test TEST_DATABASE_URL="$DATABASE_URL" PYTHON=python3

      # P26: real for one pack (jurisdictions/ca_san_jose) -- same reasoning
      # as golden/test above, no new job. Self-seeds its own reference rows
      # (scripts/check_conformance.py's own seed_reference_rows(), ON
      # CONFLICT DO UPDATE for the source rows specifically -- found for
      # real that scripts/check_golden.py's own, narrower seed above already
      # inserts a ca_san_jose.parcels row with no expected_fields, and a
      # plain DO NOTHING here would silently lose to it depending on step
      # order; see that function's own docstring), so it needs no seed step
      # of its own despite this job never running db/seeds/. Exit code here
      # means ONLY that this one real pack's checks passed -- see the
      # Makefile's own conformance: target comment and check_conformance.py's
      # own module docstring for the four areas §1.2 lists that this does
      # not yet check.
      - name: make conformance
        run: make conformance DATABASE_URL="$DATABASE_URL" PYTHON=python3

      # Spec §1.2 make schema-dump: "No diff; missing or stale generated DDL
      # fails." Regenerates db/schema.sql from the now-migrated (and
      # db-tested, though schema-only means test data doesn't affect this)
      # service database and diffs it against the committed file. The
      # target itself exits 1 and prints "... regenerated — review and
      # commit the diff." on any difference -- this is what catches a
      # migration that was added without regenerating and committing the
      # dump.
      - name: make schema-dump
        run: make schema-dump DATABASE_URL="$DATABASE_URL" PG_DUMP="$PG_DUMP"

  # P12: scripts/run_p5_acceptance.sh (permits.active/zoning.district
  # reconciliation, including the same-snapshot-churn and stale-exception
  # regressions P11/P12 fixed) was never run by any CI gate -- "both CI
  # gates green" was true and said nothing about it the entire time P9
  # broke it. See prompts/P12-p5-suite-blind-to-p9-and-ci-gap.md 1(b).
  # docs/LEDGEX_SPEC.md §11 already lists "Object store: S3-compatible
  # (R2 preferred)" as an allowed dependency -- this job exercises that
  # already-listed dependency via a throwaway MinIO, the same swap-for-R2
  # relationship .env's own comment already describes for local dev, not
  # a new one requiring a spec amendment.
  #
  # A separate job, not appended to `schema` above: its own fresh
  # postgres + object-store services, so it can never interact with
  # `schema`'s db-test/schema-dump steps or their data.
  p5-acceptance:
    runs-on: ubuntu-latest
    # P27: same reasoning as schema:'s timeout-minutes above -- no bound
    # existed, so this job also defaulted to GitHub's 360-minute ceiling.
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ledgex_ci_p5
      PSQL: /usr/lib/postgresql/16/bin/psql
      OBJECT_STORE_URL: http://localhost:9000
      OBJECT_STORE_ACCESS_KEY: ledgex_ci
      OBJECT_STORE_SECRET_KEY: ledgex_ci_throwaway_key
      OBJECT_STORE_BUCKET: ledgex-snapshots-ci
      # scripts/run_p5_acceptance.sh's own PYTHON="${PYTHON:-.venv-ingest/bin/python3}"
      # default is a developer's local, gitignored virtualenv -- this runner
      # has no such thing. Same override the Makefile's PYTHON/PSQL/PG_DUMP
      # already use; setup-python below puts the right interpreter (with
      # scripts/requirements.txt and requirements.txt installed into it) on
      # PATH as plain `python3`.
      PYTHON: python3

    steps:
      - uses: actions/checkout@v4

      # P27: same step-level bound as db.yml's schema job, same reasoning --
      # this exact step, on this exact push, hung for 20+ minutes here too
      # (run 32171649751).
      - name: Install postgresql-client-16
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          "$PSQL" --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # P22: scripts/ingest_parcels.py and scripts/ingest_zoning_permits.py
      # now import core.model.Fact (pydantic) -- requirements.txt added
      # alongside scripts/requirements.txt. NOT requirements-test.txt: this
      # job runs the acceptance script directly, not pytest, so pytest/
      # pytest-postgresql are not needed here.
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt -r requirements.txt

      # No `command:` override exists for GitHub Actions service containers
      # (the `services:` block's `options:` maps to `docker create` flags,
      # not CMD/ENTRYPOINT) -- and the official minio/minio image's
      # entrypoint requires `server <path>` as an argument, so it cannot run
      # as a bare `services:` entry the way postgres above does. Started as
      # a plain background container instead, where the command is under
      # full control.
      #
      # Pinned to RELEASE.2025-09-07T16-13-09Z, same reasoning as
      # postgis/postgis:16-3.4, pandoc 3.10.1 and import-linter 2.5.2 above
      # and in docs.yml -- an unpinned `latest` in the one job that gates
      # reconciliation correctness is the same false-diff/false-green trap
      # those pins exist to prevent. Verified against the Docker Hub API
      # (https://hub.docker.com/v2/repositories/minio/minio/tags), not
      # guessed: this was, at verification time, the tag `latest` itself
      # resolved to (matching `last_updated` timestamps for both). Confirmed
      # against the real runner after pinning -- see prompts/README.md's
      # P12 entry for the run ID.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$OBJECT_STORE_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$OBJECT_STORE_SECRET_KEY" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO never became ready" >&2
          docker logs minio >&2 || true
          exit 1

      # No `mc` (minio client) install -- boto3 is already an installed
      # dependency (scripts/requirements.txt) and every ingest script
      # already talks to the object store through it, so bucket creation
      # uses the same library the suite itself uses rather than a second
      # tool.
      - name: Create the object store bucket
        run: |
          python3 -c "
          import boto3, os
          s3 = boto3.client(
              's3',
              endpoint_url=os.environ['OBJECT_STORE_URL'],
              aws_access_key_id=os.environ['OBJECT_STORE_ACCESS_KEY'],
              aws_secret_access_key=os.environ['OBJECT_STORE_SECRET_KEY'],
          )
          s3.create_bucket(Bucket=os.environ['OBJECT_STORE_BUCKET'])
          print('bucket created:', os.environ['OBJECT_STORE_BUCKET'])
          "

      - name: Create clean database (not the service's TIGER-inited default)
        run: |
          "$PSQL" "postgresql://postgres:postgres@localhost:5432/postgres" \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE ledgex_ci_p5;"

      # Fresh migrations-only, no seed -- the strictest of the three
      # contexts CONVENTIONS.md names, and the one db/seeds/ is never
      # exercised under in CI (db.yml's own `schema` job never runs
      # db/seeds/day4_sources.sql either). Run once per push here, not
      # three times: CONVENTIONS.md's "run every suite twice, once fresh"
      # is authorial-verification discipline for whoever is proving a fix,
      # same as `schema` above only runs `make schema` once per push rather
      # than repeating it -- a CI gate's job is to catch a regression on
      # this push, not to re-derive the discipline every push already
      # satisfied when the fix was authored.
      - name: make schema
        run: make schema DATABASE_URL="$DATABASE_URL" PSQL="$PSQL"

      # scripts/run_p5_acceptance.sh is self-contained (own snapshot rows,
      # own minimal licence/jurisdiction/source/field_definition reference
      # data, ON CONFLICT DO NOTHING) -- no db/seeds/day4_sources.sql step
      # needed here, same as it needs none locally against a fresh
      # migrations-only database.
      #
      # P56 Phase 2 (B3): the runner now reads its own P5_DATABASE_URL, never
      # DATABASE_URL, and has no default (unlike GOLDEN_DATABASE_URL -- this
      # suite is NOT SAFE TO RERUN against a populated database). Same shape
      # the `make golden` step above uses for GOLDEN_DATABASE_URL: this job's
      # own DATABASE_URL (ledgex_ci_p5, already created and migrated above)
      # passed through under the new name, on the command line, job-level
      # env: block left in place because `make schema` above still needs it.
      - name: P5 acceptance suite (zoning + permits reconciliation)
        run: P5_DATABASE_URL="$DATABASE_URL" bash scripts/run_p5_acceptance.sh

  # P13: scripts/run_phaseb_acceptance.sh/check_phaseb_acceptance.py (Phase B
  # reconciliation -- new/changed/disappeared/reappeared, cross-source
  # retraction) were referenced in neither db.yml nor docs.yml, same gap
  # P12 closed for the P5 suite. This package changes ingest_parcels.py's
  # phase_e -- exactly the path this suite covers and exactly the path
  # nothing gated -- so wired in before any of that package's own code
  # changed, not after. Run once, RED-first, before writing anything: green
  # against the pre-P13 tree (see prompts/README.md's P13 entry for the
  # record of that run). Modeled directly on p5-acceptance (98cbda4/P12):
  # same postgres service, same pinned minio, same PYTHON override, its own
  # fresh services so it can never interact with `schema` or
  # `p5-acceptance`'s data.
  phaseb-acceptance:
    runs-on: ubuntu-latest
    # P27: same reasoning as schema:'s timeout-minutes above -- no bound
    # existed, so this job also defaulted to GitHub's 360-minute ceiling.
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ledgex_ci_phaseb
      PSQL: /usr/lib/postgresql/16/bin/psql
      OBJECT_STORE_URL: http://localhost:9000
      OBJECT_STORE_ACCESS_KEY: ledgex_ci
      OBJECT_STORE_SECRET_KEY: ledgex_ci_throwaway_key
      OBJECT_STORE_BUCKET: ledgex-snapshots-ci
      PYTHON: python3

    steps:
      - uses: actions/checkout@v4

      # P27: same step-level bound as db.yml's schema/p5-acceptance jobs,
      # same reasoning -- this exact step, on this exact push, hung for
      # 20+ minutes here too (run 32171649751).
      - name: Install postgresql-client-16
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          "$PSQL" --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # P22: scripts/ingest_parcels.py and scripts/ingest_zoning_permits.py
      # now import core.model.Fact (pydantic) -- requirements.txt added
      # alongside scripts/requirements.txt. NOT requirements-test.txt: this
      # job runs the acceptance script directly, not pytest, so pytest/
      # pytest-postgresql are not needed here.
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt -r requirements.txt

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$OBJECT_STORE_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$OBJECT_STORE_SECRET_KEY" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO never became ready" >&2
          docker logs minio >&2 || true
          exit 1

      - name: Create the object store bucket
        run: |
          python3 -c "
          import boto3, os
          s3 = boto3.client(
              's3',
              endpoint_url=os.environ['OBJECT_STORE_URL'],
              aws_access_key_id=os.environ['OBJECT_STORE_ACCESS_KEY'],
              aws_secret_access_key=os.environ['OBJECT_STORE_SECRET_KEY'],
          )
          s3.create_bucket(Bucket=os.environ['OBJECT_STORE_BUCKET'])
          print('bucket created:', os.environ['OBJECT_STORE_BUCKET'])
          "

      - name: Create clean database (not the service's TIGER-inited default)
        run: |
          "$PSQL" "postgresql://postgres:postgres@localhost:5432/postgres" \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE ledgex_ci_phaseb;"

      # Fresh migrations-only, no seed -- same reasoning as p5-acceptance
      # above: this is the strictest of CONVENTIONS.md's three contexts,
      # and a CI gate's job is to catch a regression on this push, not to
      # re-derive the run-three-times authorial discipline every push.
      - name: make schema
        run: make schema DATABASE_URL="$DATABASE_URL" PSQL="$PSQL"

      # scripts/run_phaseb_acceptance.sh is self-contained (own snapshot
      # rows, own minimal licence/jurisdiction/source/field_definition
      # reference data, ON CONFLICT DO NOTHING) -- no
      # db/seeds/day4_sources.sql step needed, same as p5-acceptance.
      #
      # P56 Phase 2 (B3): same reasoning as p5-acceptance's own step above --
      # PHASEB_DATABASE_URL, never DATABASE_URL, no default, this job's own
      # DATABASE_URL (ledgex_ci_phaseb) passed through under the new name.
      - name: Phase B acceptance suite (new/changed/disappeared/reappeared)
        run: PHASEB_DATABASE_URL="$DATABASE_URL" bash scripts/run_phaseb_acceptance.sh

      # P59, C5: the disappear/reappear/disappear-again flap regression.
      # Runs in THIS job, after the Phase B suite above (not a new job) --
      # reuses the same live MinIO, the same already-seeded reference rows
      # (ca_san_jose.parcels source, its licence) run_phaseb_acceptance.sh's
      # own setup already wrote, and the same fresh-per-push database. Its
      # own synthetic TEST-C5- APN never collides with the Phase B suite's
      # own fixtures, and it runs strictly after that suite's own
      # assertions have already completed.
      - name: scripts/test_parcel_flap_invariant.py (C5 flap regression)
        run: python3 scripts/test_parcel_flap_invariant.py
