name: db

on:
  push:
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest

    # Pinned to 16-3.4, not `latest` or `16`: §3 specifies "PostgreSQL 16 +
    # PostGIS 3.4" as the schema's target, and a schema-only dump taken
    # against a different major version produces a false diff against the
    # committed db/schema.sql (this project already hit exactly that
    # problem once, with a local PG 17 server).
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # NOT the service's own default database. The postgis/postgis image's
      # entrypoint runs its full init stack (postgis, postgis_topology,
      # postgis_tiger_geocoder, fuzzystrmatch extensions and the
      # tiger/tiger_data/topology schemas) against whatever database
      # POSTGRES_DB names -- not specifically the literal name "postgres",
      # against WHATEVER the default database is. Applying migrations there
      # directly means db/schema.sql picks up all of that TIGER-geocoder
      # baggage as noise. ledgex_ci is created fresh, after the container is
      # up, by the step below -- never auto-inited -- exactly the "avoid the
      # postgis image's TIGER-polluted default db" lesson from this
      # project's own earlier schema.sql fix, hit again here because a CI
      # service container has no hook to create the database before its own
      # init scripts run against whatever POSTGRES_DB says.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ledgex_ci
      # Referenced by full path, not left to resolve on PATH: Ubuntu's
      # postgresql-client-16 package does not necessarily become the
      # unqualified `psql`/`pg_dump` if another client version is already
      # present on the runner image, and a version mismatch against the
      # PostgreSQL 16 service is the same false-diff trap as above.
      PSQL: /usr/lib/postgresql/16/bin/psql
      PG_DUMP: /usr/lib/postgresql/16/bin/pg_dump

    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client-16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          "$PSQL" --version
          "$PG_DUMP" --version

      # P6 follow-up: scripts/migrate_verify.py (Python + psycopg2) needs to
      # run right after `make schema` below, to check the database that
      # target just built against its own ledger. This job had no Python
      # step before this pass -- `make schema`/`make schema-dump` are pure
      # psql/pg_dump and still are; this step exists for migrate_verify.py
      # alone.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Create clean database (not the service's TIGER-inited default)
        run: |
          "$PSQL" "postgresql://postgres:postgres@localhost:5432/postgres" \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE ledgex_ci;"

      # Spec §1.2 make schema: "Clean apply; constraints, functions and
      # triggers compile." Applies every forward-only migration, in order,
      # to the empty service database -- and, since the P6 follow-up pass,
      # records each one into schema_migrations as it goes (see the target's
      # own comment in the Makefile for why and how).
      - name: make schema
        run: make schema DATABASE_URL="$DATABASE_URL" PSQL="$PSQL"

      # P6 follow-up: independent check that the database `make schema` just
      # built actually matches what its own ledger claims -- the one thing
      # `make schema`'s own success can't prove by itself (a ledger row and
      # its DDL could still disagree if something between the two steps
      # touched the database directly). Needs CREATE DATABASE privilege to
      # build its own disposable reference -- the CI postgres service user
      # already has it (same superuser the "Create clean database" step
      # above already uses).
      - name: make migrate-verify
        run: make migrate-verify DATABASE_URL="$DATABASE_URL" PG_DUMP="$PG_DUMP"

      # The self-asserting invariant suite (I2-I5, I13, I18, the
      # parcel_exception biconditional, S1's source-access-method check, and
      # Tier 2's provenance/lifecycle constraint tests) plus a
      # separately-reported known_gaps table (I5c) that does not count
      # toward the enforced-coverage floor. Every test aborts the script
      # with a nonzero exit on any wrong outcome under ON_ERROR_STOP --
      # there is no soft-pass path.
      #
      # P18, README finding #25: db-test reads DB_TEST_DATABASE_URL, not
      # DATABASE_URL (its own default, postgresql://localhost/ledgex_test,
      # would not exist here either) -- pass this job's own already-fresh,
      # already-disposable ledgex_ci explicitly, same database every other
      # step in this job already uses.
      - name: make db-test
        run: make db-test DB_TEST_DATABASE_URL="$DATABASE_URL" PSQL="$PSQL"

      # Spec §1.2 make schema-dump: "No diff; missing or stale generated DDL
      # fails." Regenerates db/schema.sql from the now-migrated (and
      # db-tested, though schema-only means test data doesn't affect this)
      # service database and diffs it against the committed file. The
      # target itself exits 1 and prints "... regenerated — review and
      # commit the diff." on any difference -- this is what catches a
      # migration that was added without regenerating and committing the
      # dump.
      - name: make schema-dump
        run: make schema-dump DATABASE_URL="$DATABASE_URL" PG_DUMP="$PG_DUMP"

  # P12: scripts/run_p5_acceptance.sh (permits.active/zoning.district
  # reconciliation, including the same-snapshot-churn and stale-exception
  # regressions P11/P12 fixed) was never run by any CI gate -- "both CI
  # gates green" was true and said nothing about it the entire time P9
  # broke it. See prompts/P12-p5-suite-blind-to-p9-and-ci-gap.md 1(b).
  # docs/LEDGEX_SPEC.md §11 already lists "Object store: S3-compatible
  # (R2 preferred)" as an allowed dependency -- this job exercises that
  # already-listed dependency via a throwaway MinIO, the same swap-for-R2
  # relationship .env's own comment already describes for local dev, not
  # a new one requiring a spec amendment.
  #
  # A separate job, not appended to `schema` above: its own fresh
  # postgres + object-store services, so it can never interact with
  # `schema`'s db-test/schema-dump steps or their data.
  p5-acceptance:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ledgex_ci_p5
      PSQL: /usr/lib/postgresql/16/bin/psql
      OBJECT_STORE_URL: http://localhost:9000
      OBJECT_STORE_ACCESS_KEY: ledgex_ci
      OBJECT_STORE_SECRET_KEY: ledgex_ci_throwaway_key
      OBJECT_STORE_BUCKET: ledgex-snapshots-ci
      # scripts/run_p5_acceptance.sh's own PYTHON="${PYTHON:-.venv-ingest/bin/python3}"
      # default is a developer's local, gitignored virtualenv -- this runner
      # has no such thing. Same override the Makefile's PYTHON/PSQL/PG_DUMP
      # already use; setup-python below puts the right interpreter (with
      # scripts/requirements.txt installed into it) on PATH as plain
      # `python3`.
      PYTHON: python3

    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client-16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          "$PSQL" --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      # No `command:` override exists for GitHub Actions service containers
      # (the `services:` block's `options:` maps to `docker create` flags,
      # not CMD/ENTRYPOINT) -- and the official minio/minio image's
      # entrypoint requires `server <path>` as an argument, so it cannot run
      # as a bare `services:` entry the way postgres above does. Started as
      # a plain background container instead, where the command is under
      # full control.
      #
      # Pinned to RELEASE.2025-09-07T16-13-09Z, same reasoning as
      # postgis/postgis:16-3.4, pandoc 3.10.1 and import-linter 2.5.2 above
      # and in docs.yml -- an unpinned `latest` in the one job that gates
      # reconciliation correctness is the same false-diff/false-green trap
      # those pins exist to prevent. Verified against the Docker Hub API
      # (https://hub.docker.com/v2/repositories/minio/minio/tags), not
      # guessed: this was, at verification time, the tag `latest` itself
      # resolved to (matching `last_updated` timestamps for both). Confirmed
      # against the real runner after pinning -- see prompts/README.md's
      # P12 entry for the run ID.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$OBJECT_STORE_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$OBJECT_STORE_SECRET_KEY" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO never became ready" >&2
          docker logs minio >&2 || true
          exit 1

      # No `mc` (minio client) install -- boto3 is already an installed
      # dependency (scripts/requirements.txt) and every ingest script
      # already talks to the object store through it, so bucket creation
      # uses the same library the suite itself uses rather than a second
      # tool.
      - name: Create the object store bucket
        run: |
          python3 -c "
          import boto3, os
          s3 = boto3.client(
              's3',
              endpoint_url=os.environ['OBJECT_STORE_URL'],
              aws_access_key_id=os.environ['OBJECT_STORE_ACCESS_KEY'],
              aws_secret_access_key=os.environ['OBJECT_STORE_SECRET_KEY'],
          )
          s3.create_bucket(Bucket=os.environ['OBJECT_STORE_BUCKET'])
          print('bucket created:', os.environ['OBJECT_STORE_BUCKET'])
          "

      - name: Create clean database (not the service's TIGER-inited default)
        run: |
          "$PSQL" "postgresql://postgres:postgres@localhost:5432/postgres" \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE ledgex_ci_p5;"

      # Fresh migrations-only, no seed -- the strictest of the three
      # contexts CONVENTIONS.md names, and the one db/seeds/ is never
      # exercised under in CI (db.yml's own `schema` job never runs
      # db/seeds/day4_sources.sql either). Run once per push here, not
      # three times: CONVENTIONS.md's "run every suite twice, once fresh"
      # is authorial-verification discipline for whoever is proving a fix,
      # same as `schema` above only runs `make schema` once per push rather
      # than repeating it -- a CI gate's job is to catch a regression on
      # this push, not to re-derive the discipline every push already
      # satisfied when the fix was authored.
      - name: make schema
        run: make schema DATABASE_URL="$DATABASE_URL" PSQL="$PSQL"

      # scripts/run_p5_acceptance.sh is self-contained (own snapshot rows,
      # own minimal licence/jurisdiction/source/field_definition reference
      # data, ON CONFLICT DO NOTHING) -- no db/seeds/day4_sources.sql step
      # needed here, same as it needs none locally against a fresh
      # migrations-only database.
      - name: P5 acceptance suite (zoning + permits reconciliation)
        run: bash scripts/run_p5_acceptance.sh

  # P13: scripts/run_phaseb_acceptance.sh/check_phaseb_acceptance.py (Phase B
  # reconciliation -- new/changed/disappeared/reappeared, cross-source
  # retraction) were referenced in neither db.yml nor docs.yml, same gap
  # P12 closed for the P5 suite. This package changes ingest_parcels.py's
  # phase_e -- exactly the path this suite covers and exactly the path
  # nothing gated -- so wired in before any of that package's own code
  # changed, not after. Run once, RED-first, before writing anything: green
  # against the pre-P13 tree (see prompts/README.md's P13 entry for the
  # record of that run). Modeled directly on p5-acceptance (98cbda4/P12):
  # same postgres service, same pinned minio, same PYTHON override, its own
  # fresh services so it can never interact with `schema` or
  # `p5-acceptance`'s data.
  phaseb-acceptance:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ledgex_ci_phaseb
      PSQL: /usr/lib/postgresql/16/bin/psql
      OBJECT_STORE_URL: http://localhost:9000
      OBJECT_STORE_ACCESS_KEY: ledgex_ci
      OBJECT_STORE_SECRET_KEY: ledgex_ci_throwaway_key
      OBJECT_STORE_BUCKET: ledgex-snapshots-ci
      PYTHON: python3

    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client-16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          "$PSQL" --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$OBJECT_STORE_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$OBJECT_STORE_SECRET_KEY" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO never became ready" >&2
          docker logs minio >&2 || true
          exit 1

      - name: Create the object store bucket
        run: |
          python3 -c "
          import boto3, os
          s3 = boto3.client(
              's3',
              endpoint_url=os.environ['OBJECT_STORE_URL'],
              aws_access_key_id=os.environ['OBJECT_STORE_ACCESS_KEY'],
              aws_secret_access_key=os.environ['OBJECT_STORE_SECRET_KEY'],
          )
          s3.create_bucket(Bucket=os.environ['OBJECT_STORE_BUCKET'])
          print('bucket created:', os.environ['OBJECT_STORE_BUCKET'])
          "

      - name: Create clean database (not the service's TIGER-inited default)
        run: |
          "$PSQL" "postgresql://postgres:postgres@localhost:5432/postgres" \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE ledgex_ci_phaseb;"

      # Fresh migrations-only, no seed -- same reasoning as p5-acceptance
      # above: this is the strictest of CONVENTIONS.md's three contexts,
      # and a CI gate's job is to catch a regression on this push, not to
      # re-derive the run-three-times authorial discipline every push.
      - name: make schema
        run: make schema DATABASE_URL="$DATABASE_URL" PSQL="$PSQL"

      # scripts/run_phaseb_acceptance.sh is self-contained (own snapshot
      # rows, own minimal licence/jurisdiction/source/field_definition
      # reference data, ON CONFLICT DO NOTHING) -- no
      # db/seeds/day4_sources.sql step needed, same as p5-acceptance.
      - name: Phase B acceptance suite (new/changed/disappeared/reappeared)
        run: bash scripts/run_phaseb_acceptance.sh
