name: docs

on:
  push:
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    # P27: same reasoning as db.yml's schema: job -- no bound existed here
    # either, and this job's own historical wall-clock is under a minute.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Pinned to 3.10.1 -- the exact version used locally to generate the
      # committed website/*.html. Pandoc's header-id slugification has
      # changed across releases (build/build_website.py's docstring notes
      # this); apt's whatever-is-current pandoc could disagree with the
      # committed HTML on id text alone, with zero actual content drift, and
      # check_website_current would report a false failure. Pinning removes
      # that as a variable. Bump this alongside the local pandoc version if
      # website/*.html is ever regenerated with a newer one.
      - name: Install pandoc 3.10.1
        run: |
          curl -fsSL -o pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.10.1/pandoc-3.10.1-1-amd64.deb
          sudo dpkg -i pandoc.deb
          pandoc --version

      # Pinned to 2.5.2 -- the exact version make check-boundary's
      # .importlinter contracts were proven against locally (a forbidden
      # import planted in core/__init__.py, confirmed it broke the right
      # contract, reverted). A different version could parse or report
      # differently; pinning removes that as a variable, same reasoning
      # as the pandoc pin above.
      - name: Install import-linter 2.5.2
        run: pip install import-linter==2.5.2

      # Covers all six document gates: invariant/target presence in both
      # artifacts, no copied invariant table, no mangled prose duplicate,
      # docs/*.md regenerates clean, website/*.html regenerates clean
      # (requires the pandoc install above -- this step must not skip or
      # soften if pandoc were ever missing; check_website_current fails
      # loudly by design rather than passing silently).
      - name: make qa
        run: make qa

      # Separate step from make qa above, deliberately: a failure here
      # must show up in the Actions UI as "make check-boundary", not
      # buried inside a step named for a different gate. Runs
      # import-linter's I1/I15 contracts (.importlinter) and
      # build/check_jurisdiction_names.py's blocklist grep against
      # core/**/*.py, then qa_check.py again as check-boundary's own
      # third piece -- see Makefile's check-boundary target comment.
      - name: make check-boundary
        run: make check-boundary
