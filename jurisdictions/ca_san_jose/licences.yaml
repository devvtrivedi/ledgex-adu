# jurisdictions/ca_san_jose/licences.yaml (P26)
#
# Content is SPEC.md §7.2, transcribed verbatim -- no corrections found here
# (unlike sources.yaml's own parcels entry). §7.3: "Channel eligibility for
# any fact is determined solely by licences.yaml, seeded into licence +
# licence_channel and enforced by the composer (I6). Nothing else grants a
# channel." This file is descriptive intent, not the runtime authority --
# the live licence_channel table (immutable since 0033) is what I6 actually
# reads, and db/seeds/day4_sources.sql is what seeds it, independently of
# this file, today. See prompts/P26-jurisdictions-pack-format.md, design
# decision on pack/seed drift, for why that independence is deliberate and
# what stops the two from silently disagreeing.
#
# Only cc0 and cc_by_4_0 have a real licence table row today (confirmed
# live, not assumed) -- the other five entries below are declared for
# completeness (every licence a source in this pack's own sources.yaml
# references, active or not), matching sources.yaml's own "declared, not
# fabricated" posture for non-active entries.
#
# P55 (2026-08-22): two MORE real licence table rows now also exist --
# cc_by_4_0_api_2026_08 / cc0_api_2026_08 -- but are deliberately NOT added
# as entries below. This file's own header states its content is "SPEC.md
# §7.2, transcribed verbatim" -- the two new rows are a runtime SCOPE
# decision (which channel may use already-identified terms), not a new
# licence identification the spec itself describes, so they do not belong
# in a verbatim transcription of it. See db/seeds/day4_sources.sql's own
# notes column and prompts/P55-scoped-unblock.md for their authoritative
# record instead.

licences:
