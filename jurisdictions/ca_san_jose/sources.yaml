  # ---- DEFERRED for Phase 1 -- real, known, out of scope. See §7.4. ----
  - id: ca_valley_water.creek_jurisdiction
    display_name: "Valley Water creek, riparian and flood-protection jurisdiction"
    steward: Santa Clara Valley Water District
    method: direct
    licence: unknown
    phase_status: deferred
    phase_status_reason: >-
      Checklist §3 names this San José-specific and "frequently decisive": creek
      setbacks and encroachment permits can eliminate a rear-yard ADU site that
      zoning would otherwise allow. Access mode and terms unconfirmed. DEFERRED.
      Field is a declared coverage gap; rear-yard conclusions carry a stated caveat.
    active: false
    supplies: [hazard.creek_jurisdiction]
    url_verified_at: null

  - id: ca_scc_aluc.airport_influence
    display_name: "Airport influence and safety areas -- Mineta San José, Reid-Hillview"
    steward: Santa Clara County Airport Land Use Commission
    method: direct
    licence: unknown
    phase_status: deferred
    phase_status_reason: >-
      Blueprint §08 names this one of the five San José irregularities the pack
      format exists to absorb; Checklist §15 calls it a genuine differentiator.
      Two airports with influence areas over dense residential neighbourhoods;
      height and in some zones residential intensity are constrained. DEFERRED --
      declared coverage gap, and height-dependent conclusions carry a stated caveat.
    active: false
    supplies: [overlay.airport_influence]
    url_verified_at: null

  - id: ca_calfire.fhsz
    display_name: "CAL FIRE Fire Hazard Severity Zones (SRA / LRA) and WUI"
    steward: CAL FIRE
    method: direct
    licence: unknown
    phase_status: deferred
    phase_status_reason: >-
      San José is predominantly LRA with VHFHSZ and WUI exposure in the eastern and
      southern foothills. Checklist §3 requires confirming the currently ADOPTED
      CITY map, not only the state layer -- that confirmation is not done. DEFERRED.
    active: false
    supplies: [hazard.fire_severity]
    url_verified_at: null

  - id: ca_san_jose.water_retailers
    display_name: Retail water service areas and sanitary sewer authority
    steward: "Multiple -- municipal, investor-owned and mutual utilities"
    method: direct
    licence: unknown
    phase_status: deferred
    phase_status_reason: >-
      Blueprint §08: "utility provider is not a city-level constant." Which retailer
      serves a parcel is a SPATIAL LOOKUP, and connection fees, meter rules and
      will-serve processes differ by retailer. A single-provider assumption produces
      wrong cost numbers on a meaningful share of parcels. No consolidated
      machine-readable service-area layer identified. DEFERRED.
    active: false
    supplies: [utility.water_provider, utility.sewer_authority, utility.separate_meter_required]
    url_verified_at: null

  - id: ca_scc_schools.attendance_boundaries
    display_name: School district attendance boundaries
    steward: "Multiple districts; County Office of Education; NCES"
    method: direct
    licence: unknown
    phase_status: deferred
    phase_status_reason: >-
      Checklist §11: San José is served by many separate elementary, union and high
      school districts whose boundaries do not follow city limits. Many stewards,
      differing formats and cadences for one city. DEFERRED -- also gates the
      school-impact-fee input.
    active: false
    supplies: [school.attendance_boundary]
    url_verified_at: null
