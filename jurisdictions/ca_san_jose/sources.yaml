    url_verified_at: null

  - id: ca_cslb.licence_lookup
    display_name: CSLB contractor licence lookup
    steward: California CSLB
    method: direct
    licence: unknown                      # LD-3
    phase_status: blocked_rights
    phase_status_reason: "Unconfirmed. Plan App K: blocked from paid output."
    supplies: [contractor.licence_status]
